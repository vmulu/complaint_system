# when you add new dependencies run - pip install -e ".[dev]"

[project]
name = "complaint_system"
version = "0.1.0"
description = "written-complaint triage backend for a utility or service company"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "flask-sqlalchemy>3.1",
    "flask-migrate>=4.0",
    "psycopg[binary]>3.1",
    "python-dotenv>1.0",
    "faker>25.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["complaint_system*"]